        function getPredikatByScore(score) {
            if (score === null || score === undefined || isNaN(score)) {
                return { predikat: "-", keterangan: "Belum lengkap" };
            }
            const val = Number(score);
            for (const p of dbState.predicate_scales) {
                if (val >= Number(p.min) && val <= Number(p.max)) {
                    return p;
                }
            }
            if (val >= 90) return { predikat: "Mumtaz", keterangan: "Sangat baik" };
            if (val >= 80) return { predikat: "Jayyid Jiddan", keterangan: "Sangat baik" };
            if (val >= 70) return { predikat: "Jayyid", keterangan: "Baik" };
            if (val >= 60) return { predikat: "Maqbul", keterangan: "Cukup" };
            return { predikat: "Perlu Pembinaan", keterangan: "Membutuhkan pendampingan" };
        }

        // Hitung metrik setoran & ayat unik (Muroja'ah tidak dihitung sebagai ayat unik baru)
        function calculateStudentTahfizhMetrics(studentId, bulan, tahun) {
            const student = dbState.students.find(s => s.id === studentId);
            const subs = dbState.tahfizh_submissions.filter(s =>
                s.student_id === studentId &&
                s.periode_bulan === bulan &&
                s.periode_tahun === tahun &&
                s.status_validasi === "Sah"
            );

            const ziyadahSubs = subs.filter(s => s.jenis_setoran === "ziyadah");
            const murojaahSubs = subs.filter(s => s.jenis_setoran === "murojaah");
            const tasmiSubs = subs.filter(s => s.jenis_setoran === "tasmi");

            // Hitung ayat unik baru hanya dari ziyadah (mencegah duplikasi surah+ayat yang sama)
            const uniqueVerseKeys = new Set();
            ziyadahSubs.forEach(z => {
                const start = Number(z.ayat_mulai) || 1;
                const end = Number(z.ayat_selesai) || start;
                for (let a = start; a <= end; a++) {
                    uniqueVerseKeys.add(`${z.surah}:${a}`);
                }
            });

            const jumlahAyatUnikBaru = uniqueVerseKeys.size;
            const targetAyat = Number(student?.target_ayat_bulanan || 60);
            const persentaseTarget = targetAyat > 0 ? Math.min(100, Math.round((jumlahAyatUnikBaru / targetAyat) * 100)) : 0;

            const uniqueSurahs = [...new Set(subs.map(s => s.surah))];
            const uniqueJuz = [...new Set(subs.map(s => s.juz))];
            const uniqueDays = [...new Set(subs.map(s => s.tanggal))].length;
            const targetHari = Number(student?.target_hari_setoran || dbState.schedule_config.hari_efektif_default || 20);
            const hariTanpaSetoran = Math.max(0, targetHari - uniqueDays);
            const persentaseDisiplin = targetHari > 0 ? Math.min(100, Math.round((uniqueDays / targetHari) * 100)) : 0;

            const sortedDates = subs.map(s => s.tanggal).sort();
            const tanggalTerakhir = sortedDates.length > 0 ? sortedDates[sortedDates.length - 1] : "Belum ada setoran";

            return {
                totalTransaksi: subs.length,
                jumlahZiyadah: ziyadahSubs.length,
                jumlahMurojaah: murojaahSubs.length,
                jumlahTasmi: tasmiSubs.length,
                jumlahAyatUnikBaru,
                targetAyat,
                persentaseTarget,
                jumlahSurah: uniqueSurahs.length,
                daftarSurah: uniqueSurahs.join(", ") || "-",
                juzPerkembangan: uniqueJuz.join(", ") || (student?.juz_aktif || "-"),
                hariSetoran: uniqueDays,
                targetHari,
                hariTanpaSetoran,
                persentaseDisiplin,
                tanggalTerakhir
            };
        }

        // Hitung total poin aktivitas santri
        function calculateStudentPoints(studentId, bulan = null, tahun = null) {
            return dbState.student_points_ledger
                .filter(p => p.student_id === studentId && (!bulan || p.periode_bulan === bulan) && (!tahun || p.periode_tahun === tahun))

        // Evaluasi kelengkapan komponen & nilai akhir berbobot
        function evaluateStudentMonthlyAssessment(studentId, bulan, tahun) {
            const activeComponents = dbState.assessment_components.filter(c => c.status_aktif);
            const totalBobot = getTotalBobot();
            const records = dbState.student_assessments.filter(a =>
                a.student_id === studentId &&
                a.periode_bulan === bulan &&
                a.periode_tahun === tahun
            );

            const rincian = [];
            const missingComponents = [];
            let weightedSum = 0;

            activeComponents.forEach((comp, idx) => {
                const rec = records.find(r => r.assessment_component_id === comp.id);
                const hasValidScore = rec && rec.nilai !== null && rec.nilai !== undefined && rec.nilai !== "";
                if (!hasValidScore) {
                    missingComponents.push(comp.nama_komponen);
                    rincian.push({
                        no: idx + 1,
                        component_id: comp.id,
                        nama_komponen: comp.nama_komponen,
                        bobot: Number(comp.bobot),
                        nilai: null,
                        nilai_berbobot: null,
                        catatan: rec?.catatan || ""
                    });
                } else {
                    const numScore = Number(rec.nilai);
                    const weighted = Number(((numScore * Number(comp.bobot)) / 100).toFixed(2));
                    weightedSum += weighted;
                    rincian.push({
                        no: idx + 1,
                        component_id: comp.id,
                        nama_komponen: comp.nama_komponen,
                        bobot: Number(comp.bobot),
                        nilai: numScore,
                        nilai_berbobot: weighted,
                        catatan: rec?.catatan || ""
                    });
                }
            });

            const isComplete = missingComponents.length === 0 && activeComponents.length > 0 && totalBobot === 100;
            const nilaiAkhir = isComplete ? Number(weightedSum.toFixed(2)) : null;
            const predObj = isComplete ? getPredikatByScore(nilaiAkhir) : { predikat: "-", keterangan: "Menunggu kelengkapan" };

            // Deskripsi otomatis dinamis berdasarkan komponen tertinggi & terendah
            let autoDescription = "Penilaian belum lengkap.";
            if (isComplete) {
                const sorted = [...rincian].sort((a, b) => b.nilai - a.nilai);
                const strongest = sorted[0]?.nama_komponen.toLowerCase() || "hafalan";
                const weakest = sorted[sorted.length - 1]?.nama_komponen.toLowerCase() || "muroja'ah";
                autoDescription = `Santri menunjukkan perkembangan tahfizh dengan predikat ${predObj.predikat} (${predObj.keterangan}), menonjol pada aspek ${strongest}. Perhatian pada periode berikutnya diarahkan pada penguatan ${weakest} agar capaian Al-Qur'an semakin mutqin.`;
            }

            return {
                isComplete,
                totalBobotValid: totalBobot === 100,
                totalBobot,
                missingComponents,
                rincian,
                nilaiAkhir,
                predikat: predObj.predikat,
                keteranganPredikat: predObj.keterangan,
                autoDescription
            };
        }

        // Hitung Peringkat Santri Terbaik Berdasarkan Penilaian Admin, Poin & Capaian
        function getBestStudentsRanking(bulan, tahun) {
            const activeStudents = dbState.students.filter(s => s.status_aktif);
            const list = activeStudents.map(st => {
                const ev = evaluateStudentMonthlyAssessment(st.id, bulan, tahun);
                const met = calculateStudentTahfizhMetrics(st.id, bulan, tahun);
                const pts = calculateStudentPoints(st.id, bulan, tahun);

                // Jika belum semua komponen dinilai, hitung nilai rata-rata sementara dari komponen yang sudah diisi Admin
                const filledComps = ev.rincian.filter(r => r.nilai !== null);
                const partialAvg = filledComps.length > 0
                    ? Number((filledComps.reduce((a, b) => a + Number(b.nilai), 0) / filledComps.length).toFixed(2))
                    : 0;

                const rankingScore = ev.nilaiAkhir !== null ? ev.nilaiAkhir : partialAvg;
                const predObj = getPredikatByScore(rankingScore > 0 ? rankingScore : null);

                return {
                    student: st,
                    eval: ev,
                    metrics: met,
                    poin: pts,
                    rankingScore,
                    isFullScore: ev.nilaiAkhir !== null,
                    predikatRanking: rankingScore > 0 ? predObj.predikat : "Proses Evaluasi"
                };
            });

            // Urutkan berdasarkan: 1) Kelengkapan Penilaian Admin, 2) Nilai Akhir Tertinggi, 3) Total Poin Aktivitas, 4) Ayat Unik Baru
            list.sort((a, b) => {
                if (a.isFullScore !== b.isFullScore) return a.isFullScore ? -1 : 1;
                if (b.rankingScore !== a.rankingScore) return b.rankingScore - a.rankingScore;
                if (b.poin !== a.poin) return b.poin - a.poin;
                return b.metrics.jumlahAyatUnikBaru - a.metrics.jumlahAyatUnikBaru;
            });

            return list.map((item, idx) => ({ ...item, rank: idx + 1 }));
        }

        window.handleStudentPhotoUpload = function(event, previewImgId, isInstitutionLogo = false) {
            const file = event.target.files?.[0];
            if (!file) return;
            if (!file.type.startsWith("image/")) {
                showToast("Pilih file gambar (JPG/PNG/WebP)", "error");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement("canvas");
                    const MAX_SIZE = 260;
                    let w = img.width;
                    let h = img.height;
                    const minSide = Math.min(w, h);
                    const sx = (w - minSide) / 2;
                    const sy = (h - minSide) / 2;
                    canvas.width = MAX_SIZE;
                    canvas.height = MAX_SIZE;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, MAX_SIZE, MAX_SIZE);
                    const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.85);
                    if (isInstitutionLogo) {
                        appState.tempInstLogoDataUrl = compressedDataUrl;
                    } else {
                        appState.tempPhotoDataUrl = compressedDataUrl;
                    }
                    const previewEl = document.getElementById(previewImgId);
                    if (previewEl) previewEl.src = compressedDataUrl;
                    showToast(isInstitutionLogo ? "Logo lembaga siap disimpan!" : "Foto santri siap disimpan!", "success");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        function cleanForFirestore(obj) {
            // Firestore menolak nilai undefined / NaN; bersihkan agar penyimpanan tidak gagal
            return JSON.parse(JSON.stringify(obj));
        }

        function explainFirestoreError(err) {
            const code = err && err.code ? err.code : "";
            if (code.includes("permission-denied")) return "Akses ditolak oleh Firestore Rules. Pastikan Anda login sebagai Admin dan rules terbaru sudah dipublikasikan.";
            if (code.includes("unavailable") || code.includes("network")) return "Koneksi ke Cloud Firestore terputus. Periksa jaringan internet Anda.";
            if (code.includes("unauthenticated")) return "Sesi Admin telah berakhir. Silakan keluar lalu masuk kembali.";
            if (code.includes("resource-exhausted")) return "Kuota Firestore terlampaui. Coba lagi beberapa saat.";
            if (code.includes("invalid-argument") || code.includes("out-of-range")) return "Data yang dikirim tidak valid atau terlalu besar (mis. ukuran foto).";
            return "Terjadi kesalahan saat berkomunikasi dengan Cloud Firestore.";
        }

        // Santri hanya meminta E-Rapor berstatus "Diterbitkan" (sesuai Firestore Rules) dan tidak menyentuh log admin.
        async function loadProductionData(role = "santri") {
            if (IS_PREVIEW || !fbDb) return true;
            const isAdminRole = role === "admin";
            const failed = [];
            const cols = [...COLLECTIONS_PUBLIC];
            if (isAdminRole) cols.push("report_generation_logs");

            await Promise.all(cols.map(async (colName) => {
                try {
                    let ref = collection(fbDb, colName);
                    if (colName === "student_report_cards" && !isAdminRole) {
                        ref = query(ref, where("status_penerbitan", "==", "Diterbitkan"));
                    }
                    const snap = await getDocs(ref);
                    dbState[colName] = snap.docs.map(d => ({ ...d.data(), id: d.id }));
                } catch (err) {
                    console.error("Gagal memuat koleksi " + colName + ":", err);
                    failed.push(colName);
                }
            }));

            try {
                const cfgSnap = await getDoc(doc(fbDb, "schedule_config", "main"));
                if (cfgSnap.exists()) Object.assign(dbState.schedule_config, cfgSnap.data());
            } catch (err) {
                console.error("Gagal memuat schedule_config:", err);
                failed.push("schedule_config");
            }

            if (failed.length > 0) {
                showToast("Gagal memuat sebagian data (" + failed.join(", ") + "). Periksa Firestore Rules & koneksi.", "error");
                return false;
            }
            return true;
        }

        // Periode default = periode terbaru yang memiliki data (bukan lebih baru dari bulan berjalan WIB)
        function applyDefaultPeriod() {
            if (IS_PREVIEW) return;
            const wib = new Date(Date.now() + 7 * 3600 * 1000);
            const curKey = wib.getUTCFullYear() * 100 + (wib.getUTCMonth() + 1);
            let best = 0;
            ["tahfizh_submissions", "student_assessments", "student_points_ledger", "student_report_cards"].forEach(col => {
                (dbState[col] || []).forEach(r => {
                    const k = Number(r.periode_tahun) * 100 + Number(r.periode_bulan);
                    if (k && k <= curKey && k > best) best = k;
                });
            });
            const k = best || curKey;
            appState.filterTahun = String(Math.floor(k / 100));
            appState.filterBulan = String(k % 100).padStart(2, "0");
        }

        // Penerbitan otomatis tanggal 01: aplikasi web tidak berjalan di latar belakang, sehingga saat Admin
        // masuk, periode bulan sebelumnya diterbitkan otomatis jika jadwal aktif, belum pernah diproses, dan sudah ada penilaian.
        async function autoIssueCatchUp() {
            if (IS_PREVIEW || !fbDb || appState.role !== "admin") return;
            const cfg = dbState.schedule_config;
            if (!cfg || !cfg.aktif) return;
            const wib = new Date(Date.now() + 7 * 3600 * 1000);
            let pm = wib.getUTCMonth();
            let py = wib.getUTCFullYear();
            if (pm === 0) { pm = 12; py -= 1; }
            const bulan = String(pm).padStart(2, "0");
            const tahun = String(py);
            const alreadyLogged = dbState.report_generation_logs.some(l => l.periode_bulan === bulan && l.periode_tahun === tahun);
            const hasAssessments = dbState.student_assessments.some(a => a.periode_bulan === bulan && a.periode_tahun === tahun);
            if (alreadyLogged || !hasAssessments || getTotalBobot() !== 100) return;
            await window.runBatchRaporGeneration(bulan, tahun, "OTOMATIS TANGGAL 01 (00:05 WIB)");
        }

        async function saveDocument(collectionName, docId, payload) {
            if (IS_PREVIEW) {
                const list = dbState[collectionName];
                const idx = list.findIndex(item => item.id === docId);
                if (idx >= 0) {
                    list[idx] = { ...list[idx], ...payload, id: docId };
                } else {
                    list.unshift({ id: docId, ...payload });
                }
                return true;
            }
            const clean = cleanForFirestore({ ...payload, id: docId });
            try {
                await setDoc(doc(fbDb, collectionName, docId), clean, { merge: true });
            } catch (err) {
                console.error("Gagal menyimpan " + collectionName + "/" + docId + ":", err);
                showToast("Gagal menyimpan data: " + explainFirestoreError(err), "error");
                throw err;
            }
            const list = dbState[collectionName];
            const idx = list.findIndex(item => item.id === docId);
            if (idx >= 0) list[idx] = { ...list[idx], ...clean };
            else list.unshift(clean);
            return true;
        }

        async function removeDocument(collectionName, docId) {
            if (IS_PREVIEW) {
                dbState[collectionName] = dbState[collectionName].filter(item => item.id !== docId);
                return true;
            }
            const exists = dbState[collectionName].some(item => item.id === docId);
            if (exists) {
                try {
                    await deleteDoc(doc(fbDb, collectionName, docId));
                } catch (err) {
                    console.error("Gagal menghapus " + collectionName + "/" + docId + ":", err);
                    showToast("Gagal menghapus data: " + explainFirestoreError(err), "error");
                    throw err;
                }
            }
            dbState[collectionName] = dbState[collectionName].filter(item => item.id !== docId);
            return true;
        }

        async function fetchImageAsDataUrl(url) {
            try {
                const res = await fetch(url, { mode: 'cors' });
                const blob = await res.blob();
                return await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.readAsDataURL(blob);
                });
            } catch {
                return null;
            }
        }

        // ==========================================
        // MESIN OTOMATISASI PENERBITAN TANGGAL 01 (IDEMPOTEN)
        // ==========================================
        window.runBatchRaporGeneration = async function(bulan, tahun, triggerType = "OTOMATIS TANGGAL 01 (00:05 WIB)") {
            const totalBobot = getTotalBobot();
            if (totalBobot !== 100) {
                showToast(`Gagal menerbitkan nilai akhir: Total bobot komponen saat ini ${totalBobot}% (Wajib 100%)!`, "error");
                return;
            }

            const startTime = getWIBTimestamp();
            let countSuccess = 0;
            let countIncomplete = 0;
            let errorNotes = [];

            for (const student of dbState.students.filter(s => s.status_aktif)) {
                const uniqueRaporId = `${student.id}_${tahun}_${bulan}`;
                const existing = dbState.student_report_cards.find(r => r.id === uniqueRaporId);

                // Mekanisme Idempotensi: Jangan membuat dokumen final ganda jika sudah Diterbitkan
                if (existing && existing.status_penerbitan === "Diterbitkan" && triggerType.includes("OTOMATIS")) {
                    countSuccess++;
                    continue;
                }

                const evalData = evaluateStudentMonthlyAssessment(student.id, bulan, tahun);
                const totalPoin = calculateStudentPoints(student.id, bulan, tahun);
                const safeName = student.nama_lengkap.replace(/[^a-zA-Z0-9]/g, "");

                if (evalData.isComplete) {
                    const raporPayload = {
                        id: uniqueRaporId,
                        student_id: student.id,
                        nomor_dokumen: `ERK/RQK/${tahun}/${bulan}/${student.id}`,
                        periode_bulan: bulan,
                        periode_tahun: tahun,
                        nilai_akhir: evalData.nilaiAkhir,
                        predikat: evalData.predikat,
                        total_poin: totalPoin,
                        status_penilaian: "Diterbitkan",
                        status_penerbitan: "Diterbitkan",
                        deskripsi_pencapaian: existing?.deskripsi_pencapaian && existing.status_penerbitan === "Diterbitkan"
                            ? existing.deskripsi_pencapaian
                            : evalData.autoDescription,
                        kategori_perkembangan: evalData.nilaiAkhir >= 80 ? "Berkembang Sangat Baik" : (evalData.nilaiAkhir >= 70 ? "Berkembang Sesuai Harapan" : "Perlu Pendampingan Intensif"),
                        catatan_perkembangan: existing?.catatan_perkembangan || {
                            kelebihan: "Konsistensi setoran dan adab belajar terjaga dengan baik.",
                            perlu_ditingkatkan: "Ketepatan makhraj dan kelancaran muroja'ah mandiri.",
                            rekomendasi_hafalan: `Melanjutkan target hafalan pada ${student.juz_aktif}.`,
                            rekomendasi_murojaah: "Muroja'ah rutin minimal 1 halaman setiap selesai shalat fardhu.",
                            catatan_pembimbing: "Teruslah bersemangat menjaga kemuliaan Al-Qur'an.",
                            pesan_motivasi: "Sebaik-baik kalian adalah yang mempelajari Al-Qur'an dan mengajarkannya."
                        },
                        pengesahan: {
                            nama_penanggung_jawab: dbState.schedule_config.nama_penanggung_jawab,
                            jabatan: "Kepala Rumah Qur'an Kitabunaa",
                            kota: dbState.schedule_config.kota_pengesahan,
                            disahkan: true,
                            tanggal_pengesahan: getWIBTimestamp().split(" ")[0]
                        },
                        pdf_storage_path: `private/rapor/${tahun}-${bulan}/E-Rapor_${safeName}_${tahun}-${bulan}.pdf`,
                        tanggal_diterbitkan: getWIBTimestamp(),
                        versi_rapor: existing ? Number(existing.versi_rapor || 1) : 1,
                        riwayat_revisi: existing?.riwayat_revisi || [],
                        created_at: existing?.created_at || new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    };
                    await saveDocument("student_report_cards", uniqueRaporId, raporPayload);
                    countSuccess++;
                } else {
                    const incompletePayload = {
                        id: uniqueRaporId,
                        student_id: student.id,
                        nomor_dokumen: `ERK/RQK/${tahun}/${bulan}/${student.id}`,
                        periode_bulan: bulan,
                        periode_tahun: tahun,
                        nilai_akhir: null,
                        predikat: "-",
                        total_poin: totalPoin,
                        status_penilaian: "Menunggu kelengkapan",
                        status_penerbitan: "Menunggu Kelengkapan",
                        deskripsi_pencapaian: `Menunggu kelengkapan penilaian (${evalData.missingComponents.join(", ")}).`,
                        kategori_perkembangan: "Menunggu Kelengkapan",
                        catatan_perkembangan: existing?.catatan_perkembangan || {
                            kelebihan: "-",
                            perlu_ditingkatkan: "-",
                            rekomendasi_hafalan: "-",
                            rekomendasi_murojaah: "-",
                            catatan_pembimbing: "Penilaian belum lengkap.",
                            pesan_motivasi: "Tetap semangat menghafal Al-Qur'an."
                        },
                        pengesahan: {
                            nama_penanggung_jawab: dbState.schedule_config.nama_penanggung_jawab,
                            jabatan: "Kepala Rumah Qur'an Kitabunaa",
                            kota: dbState.schedule_config.kota_pengesahan,
                            disahkan: false,
                            tanggal_pengesahan: "-"
                        },
                        pdf_storage_path: "",
                        tanggal_diterbitkan: "-",
                        versi_rapor: existing?.versi_rapor || 1,
                        riwayat_revisi: existing?.riwayat_revisi || [],
                        created_at: existing?.created_at || new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    };
                    await saveDocument("student_report_cards", uniqueRaporId, incompletePayload);
                    countIncomplete++;
                    errorNotes.push(`${student.nama_lengkap}: kurang ${evalData.missingComponents.length} komponen`);
                }
            }

            const endTime = getWIBTimestamp();
            const logId = `LOG_${tahun}_${bulan}_${Date.now()}`;
            await saveDocument("report_generation_logs", logId, {
                id: logId,
                periode_bulan: bulan,
                periode_tahun: tahun,
                jenis_pemicu: triggerType,
                mulai_proses: startTime,
                selesai_proses: endTime,
                jumlah_rapor_berhasil: countSuccess,
                jumlah_rapor_gagal: countIncomplete,
                status_proses: countIncomplete === 0 ? "Berhasil 100%" : `Selesai Sebagian (${countIncomplete} Menunggu Kelengkapan)`,
                pesan_error: errorNotes.length > 0 ? errorNotes.join(" | ") : "Tidak ada kendala. Seluruh E-Rapor berhasil diterbitkan.",
                created_at: new Date().toISOString()
            });

            renderApp();
            if (countIncomplete > 0) {
                showToast(`${countSuccess} E-Rapor diterbitkan, ${countIncomplete} santri ditandai "Menunggu Kelengkapan"`, "warning");
            } else {
                showToast(`Seluruh ${countSuccess} E-Rapor periode ${getMonthName(bulan)} ${tahun} berhasil diterbitkan!`, "success");
            }
        };

        // ==========================================
        // RENDER UTAMA APLIKASI
        // ==========================================
        function renderApp() {
            const root = document.getElementById("app-wrapper");
            if (!root) return;

            if (!appState.user) {
                root.innerHTML = renderLoginScreen();
                lucide.createIcons();
                return;
            }

            if (appState.role === "admin") {
                root.innerHTML = renderAdminLayout();
            } else {
                root.innerHTML = renderSantriLayout();
            }
            lucide.createIcons();
        }
        window.renderApp = renderApp;

            if (IS_PREVIEW) {

                        window.quickPreviewLogin("admin");

                } else {
                    const found = dbState.students.find(s =>
                        (s.username.toLowerCase() === idVal.toLowerCase() || s.nis === idVal) && s.password === passVal
                    );
                    if (found) {
                        appState.role = "santri";
                        appState.user = found;

                        showToast(`Ahlan wa sahlan, ${found.nama_lengkap}`, "success");

                return;
            }

                    appState.user = { id: cred.user.uid, nama_lengkap: cred.user.email.split("@")[0], email: cred.user.email };

                    await seedDefaultsIfEmpty();
                    applyDefaultPeriod();
                    appState.activeMenu = "dashboard";
                    showToast("Login Admin Berhasil", "success");
                    renderApp();
                    await autoIssueCatchUp();
                } else {
                    // Pastikan tidak ada sesi Admin tersisa pada perangkat ini saat Santri masuk
                    if (fbAuth.currentUser) { try { await signOut(fbAuth); } catch {} }
                    await loadProductionData("santri");
                    const found = dbState.students.find(s =>
                        (String(s.username).toLowerCase() === idVal.toLowerCase() || String(s.nis) === idVal) &&
                        String(s.password) === passVal && s.status_aktif !== false
                    );
                    if (!found) {
                        showToast("Akun Santri tidak ditemukan atau kata sandi salah.", "error");
                        return;

                    applyDefaultPeriod();
                    appState.role = "santri";
                    appState.user = found;
                    appState.activeMenu = "beranda";
                    showToast(`Ahlan wa sahlan, ${found.nama_lengkap}`, "success");
                    renderApp();
                }
            } catch (err) {
                console.error(err);
                appState.role = null;
                appState.user = null;
                const code = err && err.code ? err.code : "";
                if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found") || code.includes("invalid-email")) {
                    showToast("Email atau kata sandi Admin salah.", "error");
                } else if (code.includes("too-many-requests")) {
                    showToast("Terlalu banyak percobaan masuk. Coba lagi beberapa saat.", "error");
                } else if (code.includes("network")) {
                    showToast("Koneksi internet bermasalah. Periksa jaringan Anda.", "error");
                } else if (code.includes("operation-not-allowed") || code.includes("configuration-not-found")) {
                    showToast("Metode Email/Password belum diaktifkan di Firebase Authentication.", "error");

        // Generator Grafik Perkembangan Profesional (SVG Line/Area + Bar Chart)
        function renderProfessionalDevelopmentChart(selectedStudentId = "ALL", tahun = "2026") {
            const chartMonths = [
                { val: "06", short: "Jun" },
                { val: "07", short: "Jul" },
                { val: "08", short: "Agu" },
                { val: "09", short: "Sep" },
                { val: "10", short: "Okt" },
                { val: "11", short: "Nov" }
            ];

            const targetStudents = selectedStudentId === "ALL"
                ? dbState.students.filter(s => s.status_aktif)
                : dbState.students.filter(s => s.id === selectedStudentId);

            const monthlySeries = chartMonths.map((m, idx) => {
                let totalAyat = 0;
                let scores = [];
                let totalPoin = 0;

                targetStudents.forEach(st => {
                    const met = calculateStudentTahfizhMetrics(st.id, m.val, tahun);
                    const ev = evaluateStudentMonthlyAssessment(st.id, m.val, tahun);
                    const pt = calculateStudentPoints(st.id, m.val, tahun);
                    totalAyat += met.jumlahAyatUnikBaru;
                    if (ev.nilaiAkhir !== null) scores.push(ev.nilaiAkhir);
                    totalPoin += pt;
                });

                // Untuk visualisasi tren profesional pada bulan yang belum berjalan, tampilkan baseline historis jika di mode preview
                const fallbackScores = [78, 81, 84, 87, 89, 91];
                const fallbackAyat = [32, 38, 50, 40, 45, 55];

                const avgScore = scores.length > 0
                    ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length)
                    : (IS_PREVIEW && idx <= 3 ? fallbackScores[idx] : 0);

                const ayatCount = totalAyat > 0
                    ? totalAyat
                    : (IS_PREVIEW && idx <= 2 ? fallbackAyat[idx] : 0);

                return {
                    label: m.short,
                    bulanVal: m.val,
                    avgScore,
                    ayatCount,
                    totalPoin
                };
            });

            // Hitung koordinat SVG (Lebar 600, Tinggi 210)
            const svgW = 600, svgH = 210, padL = 42, padR = 24, padT = 24, padB = 34;
            const plotW = svgW - padL - padR;
            const plotH = svgH - padT - padB;
            const stepX = plotW / (monthlySeries.length - 1);

            const points = monthlySeries.map((d, i) => {
                const x = padL + i * stepX;
                const clampedScore = Math.max(0, Math.min(100, d.avgScore));
                const yScore = padT + plotH - (clampedScore / 100) * plotH;
                const clampedAyat = Math.max(0, Math.min(100, d.ayatCount));
                const yAyat = padT + plotH - (clampedAyat / 100) * plotH;
                return { ...d, x, yScore, yAyat };
            });

            const polylineScore = points.map(p => `${p.x},${p.yScore}`).join(" ");
            const areaScore = `${points[0].x},${padT + plotH} ${polylineScore} ${points[points.length - 1].x},${padT + plotH}`;

            return `
            <div class="w-full">
                <div class="flex flex-wrap items-center justify-between gap-2 mb-3">

                                <stop offset="100%" stop-color="#26B2C9" stop-opacity="0.02"/>

                        ${[0, 25, 50, 75, 100].map(val => {
                            const y = padT + plotH - (val / 100) * plotH;

                        ${points.map(p => `

                                <rect x="${p.x - 18}" y="${p.yScore - 24}" width="36" height="16" rx="6" fill="#00768B" />

                                <text x="${p.x}" y="${svgH - 10}" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="800">${p.label}</text>
                            </g>
                        `).join("")}
                    </svg>
                </div>
            </div>`;
        }

        window.saveSetoranForm = async function(e) {
            e.preventDefault();
            const studentId = document.getElementById("sub-student").value;
            const tanggal = document.getElementById("sub-date").value;
            const jenis = document.getElementById("sub-type").value;
            const juz = document.getElementById("sub-juz").value.trim();
            const surah = document.getElementById("sub-surah").value;
            const start = Number(document.getElementById("sub-start").value);
            const end = Number(document.getElementById("sub-end").value);
            const kualitas = Number(document.getElementById("sub-kualitas").value);
            const tajwid = Number(document.getElementById("sub-tajwid").value);
            const catatan = document.getElementById("sub-note").value.trim();

            if (end < start) {
                showToast("Ayat selesai tidak boleh lebih kecil dari ayat mulai", "error");
                return;
            }

            const [tahun, bulan] = tanggal.split("-");

            // Pencegahan transaksi ganda & poin ganda
            const duplicate = dbState.tahfizh_submissions.find(s =>
                s.student_id === studentId && s.tanggal === tanggal &&
                s.jenis_setoran === jenis && s.surah === surah &&
                Number(s.ayat_mulai) === start && Number(s.ayat_selesai) === end &&
                s.status_validasi === "Sah"
            );
            if (duplicate) {
                showToast("Transaksi setoran yang persis sama sudah tercatat! Mencegah poin ganda.", "warning");
                return;
            }

            const ayatUnik = jenis === "ziyadah" ? (end - start + 1) : 0;
            const subId = `SUB_${Date.now()}`;

            await saveDocument("tahfizh_submissions", subId, {
                id: subId,
                student_id: studentId,
                tanggal,
                periode_bulan: bulan,
                periode_tahun: tahun,
                jenis_setoran: jenis,
                juz,
                surah,
                ayat_mulai: start,
                ayat_selesai: end,
                jumlah_ayat_unik_baru: ayatUnik,
                nilai_kualitas: kualitas,
                nilai_tajwid: tajwid,
                status_validasi: "Sah",
                catatan,
                created_by: appState.user.nama_lengkap,
                created_at: new Date().toISOString()
            });

            // Tambahkan poin aktivitas sesuai aturan
            const poinMap = {
                ziyadah: { kat: "Menyelesaikan setoran hafalan baru sesuai target", pts: 10 },
                murojaah: { kat: "Menyelesaikan muroja'ah sesuai target", pts: 5 },
                tasmi: { kat: "Mengikuti tasmi' sesuai program", pts: 10 }
            };
            const rule = poinMap[jenis];
            const ptId = `PT_${Date.now()}`;
            await saveDocument("student_points_ledger", ptId, {
                id: ptId,
                student_id: studentId,
                kategori_poin: rule.kat,
                jumlah_poin: rule.pts,
                alasan: `Setoran ${jenis.toUpperCase()} ${surah} ayat ${start}-${end}`,
                referensi_transaksi: subId,
                periode_bulan: bulan,
                periode_tahun: tahun,
                created_by: appState.user.nama_lengkap,
                created_at: getWIBTimestamp()
            });

            closeModal();
            renderApp();
            showToast(`Setoran berhasil disimpan & +${rule.pts} Poin Aktivitas tercatat!`, "success");
        };

        window.cancelSubmission = async function(subId) {
            const sub = dbState.tahfizh_submissions.find(s => s.id === subId);
            if (!sub || sub.status_validasi !== "Sah") return;

            await saveDocument("tahfizh_submissions", subId, {
                ...sub,
                status_validasi: "Dibatalkan"
            });

            // Buat transaksi penyesuaian/pembatalan poin di ledger tanpa menghapus riwayat audit
            const relatedPoint = dbState.student_points_ledger.find(p => p.referensi_transaksi === subId && p.jumlah_poin > 0);
            if (relatedPoint) {
                const adjId = `PT_ADJ_${Date.now()}`;
                await saveDocument("student_points_ledger", adjId, {
                    id: adjId,
                    student_id: sub.student_id,
                    kategori_poin: "Penyesuaian / Pembatalan Transaksi Setoran",

                    periode_tahun: sub.periode_tahun,
                    created_by: appState.user.nama_lengkap,
                    created_at: getWIBTimestamp()
                });
            }

            renderApp();
            showToast("Transaksi dibatalkan & poin disesuaikan dalam riwayat audit.", "warning");
        };

        window.autoFillFromSubmissions = function(studentId) {
            const bulan = appState.filterBulan;
            const tahun = appState.filterTahun;
            const metrics = calculateStudentTahfizhMetrics(studentId, bulan, tahun);
            const subs = dbState.tahfizh_submissions.filter(s => s.student_id === studentId && s.periode_bulan === bulan && s.periode_tahun === tahun && s.status_validasi === "Sah");
            const avgKualitas = subs.length > 0 ? Math.round(subs.reduce((a, b) => a + Number(b.nilai_kualitas || 85), 0) / subs.length) : 88;
            const avgTajwid = subs.length > 0 ? Math.round(subs.reduce((a, b) => a + Number(b.nilai_tajwid || 85), 0) / subs.length) : 85;

            const rawDefaults = [avgKualitas, avgKualitas, Math.max(75, metrics.persentaseTarget), Math.max(80, metrics.persentaseDisiplin), avgTajwid, 92];
            // Snap ke nilai dropdown terdekat pada SCORE_OPTIONS
            const snapToOption = (val) => {
                let closest = SCORE_OPTIONS[0].val;
                let minDiff = Math.abs(val - closest);
                for (const opt of SCORE_OPTIONS) {
                    const diff = Math.abs(val - opt.val);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closest = opt.val;
                    }
                }
                return closest;
            };

            dbState.assessment_components.filter(c => c.status_aktif).forEach((comp, idx) => {
                const selectEl = document.getElementById(`comp-score-${comp.id}`);
                if (selectEl) selectEl.value = String(snapToOption(rawDefaults[idx] ?? 85));
            });
            showToast("Nilai rata-rata otomatis disesuaikan ke pilihan predikat terdekat. Klik Simpan untuk menerapkan.", "info");
        };

        window.saveMonthlyAssessmentForm = async function(e, studentId) {
            e.preventDefault();
            const submitter = e.submitter?.value || "save";
            const bulan = appState.filterBulan;
            const tahun = appState.filterTahun;
            const activeComponents = dbState.assessment_components.filter(c => c.status_aktif);

            for (const comp of activeComponents) {
                const rawScore = document.getElementById(`comp-score-${comp.id}`)?.value;
                const note = document.getElementById(`comp-note-${comp.id}`)?.value.trim() || "";

                if (rawScore !== "" && Number(rawScore) === 0 && !note) {
                    showToast(`Nilai 0 pada "${comp.nama_komponen}" wajib disertai alasan pada kolom catatan!`, "error");
                    return;
                }

                const recId = `AS_${studentId}_${bulan}_${tahun}_${comp.id}`;
                if (rawScore === "") {
                    await removeDocument("student_assessments", recId);
                } else {
                    await saveDocument("student_assessments", recId, {
                        id: recId,
                        student_id: studentId,
                        assessment_component_id: comp.id,
                        periode_bulan: bulan,
                        periode_tahun: tahun,
                        nilai: Number(rawScore),
                        catatan: note,
                        dinilai_oleh: appState.user.nama_lengkap,
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString()
                    });
                }
            }

            const evalData = evaluateStudentMonthlyAssessment(studentId, bulan, tahun);
            if (!evalData.totalBobotValid) {
                showToast(`Peringatan: Total bobot komponen ${evalData.totalBobot}% (belum 100%). Nilai akhir ditahan!`, "error");
                return;
            }

            const student = dbState.students.find(s => s.id === studentId);
            const totalPoin = calculateStudentPoints(studentId, bulan, tahun);
            const uniqueRaporId = `${studentId}_${tahun}_${bulan}`;
            const existing = dbState.student_report_cards.find(r => r.id === uniqueRaporId);
            let requestedStatus = document.getElementById("as-status").value;

            if (submitter === "publish") {
                if (!evalData.isComplete) {
                    showToast(`Tidak dapat menerbitkan E-Rapor Final! Masih ada ${evalData.missingComponents.length} komponen belum dinilai.`, "error");
                    requestedStatus = "Menunggu kelengkapan";
                } else {
                    requestedStatus = existing && existing.status_penerbitan === "Diterbitkan" ? "Direvisi" : "Diterbitkan";
                }
            } else if (!evalData.isComplete && (requestedStatus === "Diterbitkan" || requestedStatus === "Siap diterbitkan")) {
                requestedStatus = "Menunggu kelengkapan";
            }

            const isPublished = (requestedStatus === "Diterbitkan" || requestedStatus === "Direvisi") && evalData.isComplete;
            const safeName = student.nama_lengkap.replace(/[^a-zA-Z0-9]/g, "");

            // Simpan riwayat versi sebelumnya jika direvisi
            const revisionHistory = [...(existing?.riwayat_revisi || [])];
            let nextVersion = existing?.versi_rapor || 1;
            if (existing && existing.status_penerbitan === "Diterbitkan" && isPublished) {
                nextVersion += 1;
                revisionHistory.push({
                    versi: existing.versi_rapor,
                    nilai_akhir: existing.nilai_akhir,
                    predikat: existing.predikat,
                    tanggal_revisi: getWIBTimestamp(),
                    direvisi_oleh: appState.user.nama_lengkap
                });
            }

            const raporPayload = {
                id: uniqueRaporId,
                student_id: studentId,
                nomor_dokumen: `ERK/RQK/${tahun}/${bulan}/${studentId}`,
                periode_bulan: bulan,
                periode_tahun: tahun,
                nilai_akhir: evalData.nilaiAkhir,
                predikat: evalData.predikat,
                total_poin: totalPoin,
                status_penilaian: requestedStatus,
                status_penerbitan: isPublished ? "Diterbitkan" : (evalData.isComplete ? "Siap diterbitkan" : "Menunggu Kelengkapan"),
                deskripsi_pencapaian: document.getElementById("as-deskripsi").value.trim() || evalData.autoDescription,
                kategori_perkembangan: evalData.nilaiAkhir >= 80 ? "Berkembang Sangat Baik" : "Berkembang Sesuai Harapan",
                catatan_perkembangan: {
                    kelebihan: document.getElementById("as-kelebihan").value.trim(),
                    perlu_ditingkatkan: document.getElementById("as-tingkatkan").value.trim(),
                    rekomendasi_hafalan: document.getElementById("as-rek-hafalan").value.trim(),
                    rekomendasi_murojaah: document.getElementById("as-rek-murojaah").value.trim(),
                    catatan_pembimbing: document.getElementById("as-pembimbing").value.trim(),
                    pesan_motivasi: document.getElementById("as-motivasi").value.trim()
                },
                pengesahan: {
                    nama_penanggung_jawab: dbState.schedule_config.nama_penanggung_jawab,
                    jabatan: "Kepala Rumah Qur'an Kitabunaa",
                    kota: dbState.schedule_config.kota_pengesahan,
                    disahkan: isPublished,
                    tanggal_pengesahan: isPublished ? getWIBTimestamp().split(" ")[0] : "-"
                },
                pdf_storage_path: isPublished ? `private/rapor/${tahun}-${bulan}/E-Rapor_${safeName}_${tahun}-${bulan}.pdf` : "",
                tanggal_diterbitkan: isPublished ? getWIBTimestamp() : "-",
                versi_rapor: nextVersion,
                riwayat_revisi: revisionHistory,
                created_at: existing?.created_at || new Date().toISOString(),
                updated_at: new Date().toISOString()
            };

            await saveDocument("student_report_cards", uniqueRaporId, raporPayload);
            renderApp();
            showToast(isPublished ? `E-Rapor ${student.nama_lengkap} berhasil diterbitkan (Versi ${nextVersion})!` : "Data penilaian bulanan berhasil disimpan.", "success");
        };

        window.saveInstitutionForm = async function(e, existingId) {
            e.preventDefault();
            const id = existingId || `INST_${Date.now()}`;
            const isUtama = document.getElementById("inst-utama").checked;

            if (isUtama) {
                for (const item of dbState.institution_profiles) {
                    if (item.id !== id && item.is_utama) {
                        await saveDocument("institution_profiles", item.id, { ...item, is_utama: false });
                    }
                }
            }

            const payload = {
                id,
                nama_lembaga: document.getElementById("inst-nama").value.trim(),
                nsm_npsn: document.getElementById("inst-nsm").value.trim(),
                sub_judul: document.getElementById("inst-sub").value.trim(),
                kepala_lembaga: document.getElementById("inst-kepala").value.trim(),
                jabatan_pengesah: document.getElementById("inst-jabatan").value.trim(),
                kota_pengesahan: document.getElementById("inst-kota").value.trim(),
                telepon: document.getElementById("inst-telp").value.trim(),
                email: document.getElementById("inst-email").value.trim(),
                website: document.getElementById("inst-web").value.trim(),
                alamat: document.getElementById("inst-alamat").value.trim(),
                logo_url: appState.tempInstLogoDataUrl || LOGO_URL,
                is_utama: isUtama || dbState.institution_profiles.length === 0,
                created_at: new Date().toISOString()
            };

            if (payload.is_utama) {
                dbState.schedule_config.nama_penanggung_jawab = payload.kepala_lembaga;
                dbState.schedule_config.kota_pengesahan = payload.kota_pengesahan;
            }

            await saveDocument("institution_profiles", id, payload);
            if (payload.is_utama) await persistScheduleConfig();
            closeModal();
            renderApp();
            showToast(`Profil lembaga "${payload.nama_lembaga}" berhasil disimpan!`, "success");
        };

        window.setPrimaryInstitution = async function(instId) {
            for (const item of dbState.institution_profiles) {
                const makePrimary = item.id === instId;
                await saveDocument("institution_profiles", item.id, { ...item, is_utama: makePrimary });
                if (makePrimary) {
                    dbState.schedule_config.nama_penanggung_jawab = item.kepala_lembaga;
                    dbState.schedule_config.kota_pengesahan = item.kota_pengesahan;
                }
            }
            await persistScheduleConfig();
            renderApp();
            showToast("Profil lembaga utama berhasil diperbarui!", "success");
        };

        window.deleteInstitutionProfile = async function(instId) {
            const target = dbState.institution_profiles.find(i => i.id === instId);
            if (!target) return;
            await removeDocument("institution_profiles", instId);
            if (dbState.institution_profiles.length > 0 && !dbState.institution_profiles.some(i => i.is_utama)) {
                dbState.institution_profiles[0].is_utama = true;
            }
            renderApp();
            showToast(`Profil lembaga "${target.nama_lembaga}" telah dihapus.`, "warning");
        };

                <div class="space-y-6">
                    <!-- Header Grafik Perkembangan Santri -->
                    <div class="bg-gradient-to-r from-brand-800 via-brand-700 to-brand-600 rounded-3xl p-5 sm:p-6 text-white shadow-md flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <span class="bg-accent-400 text-brand-950 text-[10px] font-extrabold px-3 py-1 rounded-full uppercase">Analitik Perkembangan Tahfizh</span>
                            <h2 class="text-lg sm:text-xl font-extrabold mt-2">Dashboard Grafik Perkembangan — ${student.nama_lengkap}</h2>
                            <p class="text-xs text-brand-100 mt-0.5">Visualisasi capaian Nilai Akhir, 6 Komponen Penilaian, Ayat Unik Baru, dan Kualitas Bacaan.</p>
                        </div>
                        <div class="bg-white/15 backdrop-blur px-4 py-3 rounded-2xl text-center shrink-0">
                            <span class="text-[10px] font-bold text-brand-100 uppercase block">Predikat Bulan Ini</span>
                            <span class="text-lg font-extrabold text-accent-400">${evalData.predikat} (${evalData.nilaiAkhir ?? 'Proses'})</span>
                        </div>
                    </div>

                    <!-- Grafik Tren Bulanan (Line + Bar Chart) -->
                    <div class="bg-white rounded-3xl p-5 sm:p-6 border border-brand-100 shadow-sm">
                        <div class="mb-4 pb-3 border-b border-slate-100">
                            <h3 class="font-extrabold text-brand-900 text-base flex items-center gap-2">
                                <i data-lucide="trending-up" class="w-5 h-5 text-brand-600"></i> Tren Nilai Akhir & Pertumbuhan Ayat Unik Baru (${tahun})
                            </h3>
                            <p class="text-xs text-slate-500">Grafik perkembangan nilai bulanan dan total ayat baru yang disetorkan setiap bulan.</p>
                        </div>
                        ${renderProfessionalDevelopmentChart(student.id, tahun)}
                    </div>

                    <!-- Grafik Performa 6 Komponen Penilaian & Riwayat Kualitas Setoran -->
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        <div class="lg:col-span-7 bg-white rounded-3xl p-5 sm:p-6 border border-brand-100 shadow-sm">
                            <h3 class="font-extrabold text-brand-900 text-base mb-1">Grafik Batang 6 Komponen Penilaian (${getMonthName(bulan)} ${tahun})</h3>
                            <p class="text-xs text-slate-500 mb-4">Perbandingan capaian setiap komponen penilaian terhadap skala maksimal 100.</p>
                            <div class="space-y-3.5">
                                ${evalData.rincian.map(r => {
                                    const val = r.nilai !== null ? Number(r.nilai) : 0;
                                    const pLabel = r.nilai !== null ? getPredikatByScore(val).predikat : "Belum Dinilai";
                                    const barColor = val >= 90 ? "bg-emerald-500" : (val >= 80 ? "bg-brand-600" : "bg-amber-500");
                                    return `
                                    <div>
                                        <div class="flex items-center justify-between text-xs mb-1">
                                            <span class="font-bold text-slate-700">${r.no}. ${r.nama_komponen} <span class="text-[11px] text-slate-400">(Bobot ${r.bobot}%)</span></span>
                                            <span class="font-extrabold text-brand-950">${r.nilai !== null ? `${val} — ${pLabel}` : 'Belum Dinilai'}</span>
                                        </div>
                                        <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden border border-slate-200/60">
                                            <div class="${barColor} h-full rounded-full transition-all duration-500" style="width: ${val}%"></div>
                                        </div>
                                    </div>`;
                                }).join("")}
                            </div>
                        </div>

                        <div class="lg:col-span-5 bg-white rounded-3xl p-5 sm:p-6 border border-brand-100 shadow-sm flex flex-col justify-between">
                            <div>
                                <h3 class="font-extrabold text-brand-900 text-base mb-1">Statistik Kualitas & Tajwid Setoran</h3>
                                <p class="text-xs text-slate-500 mb-4">Rekapitulasi rata-rata kualitas bacaan dari seluruh setoran yang sah.</p>
                                <div class="grid grid-cols-2 gap-3 mb-4">
                                    <div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200 text-center">
                                        <span class="text-[10px] font-bold text-emerald-700 uppercase block">Total Transaksi Sah</span>
                                        <span class="text-xl font-extrabold text-emerald-900">${mySubs.length} Setoran</span>
                                    </div>
                                    <div class="p-3.5 rounded-2xl bg-brand-50 border border-brand-200 text-center">
                                        <span class="text-[10px] font-bold text-brand-700 uppercase block">Disiplin Kehadiran</span>
                                        <span class="text-xl font-extrabold text-brand-900">${metrics.persentaseDisiplin}%</span>
                                    </div>
                                </div>
                                <div class="space-y-2.5 max-h-56 overflow-y-auto custom-scroll pr-1">
                                    ${mySubs.slice(0, 6).map(s => `
                                        <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs">
                                            <div class="min-w-0 pr-2">
                                                <p class="font-extrabold text-brand-950 truncate">${s.surah} : ${s.ayat_mulai}–${s.ayat_selesai}</p>
                                                <p class="text-[11px] text-slate-500">${s.tanggal} • ${s.juz} (${s.jenis_setoran.toUpperCase()})</p>
                                            </div>
                                            <div class="text-right shrink-0">
                                                <span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 font-extrabold text-[11px]">Kualitas: ${s.nilai_kualitas}</span>
                                            </div>
                                        </div>
                                    `).join("")}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }

            if (appState.activeMenu === "poin_saya") {
                const myLedger = dbState.student_points_ledger.filter(p => p.student_id === student.id);
                return `
                <div class="bg-white rounded-3xl p-5 sm:p-6 border border-brand-100 shadow-sm mb-6 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-400 uppercase">Total Poin Aktivitas (${getMonthName(bulan)} ${tahun})</p>
                        <h2 class="text-2xl sm:text-3xl font-extrabold text-amber-500 mt-1">+${totalPoin} Poin</h2>
                        <p class="text-xs text-slate-500 mt-1">Kedisiplinan Setoran: <b>${metrics.hariSetoran}/${metrics.targetHari} Hari (${metrics.persentaseDisiplin}%)</b></p>
                    </div>
                    <div class="w-16 h-16 rounded-3xl bg-amber-100 text-amber-600 flex items-center justify-center">
                        <i data-lucide="award" class="w-9 h-9"></i>
                    </div>
                </div>
                <div class="bg-white rounded-3xl p-5 border border-brand-100 shadow-sm space-y-3">
                    <h3 class="font-extrabold text-brand-900 text-base">Riwayat Perolehan Poin Saya</h3>
                    ${myLedger.length === 0 ? `<p class="text-xs text-slate-400 py-6 text-center">Belum ada catatan poin pada periode ini.</p>` : myLedger.map(p => `
                        <div class="p-3.5 rounded-2xl bg-brand-50/60 border border-brand-100 flex items-center justify-between gap-3">
                            <div>
                                <p class="font-extrabold text-xs sm:text-sm text-brand-950">${p.kategori_poin}</p>
                                <p class="text-xs text-slate-500">${p.alasan} • ${p.created_at}</p>
                            </div>
                            <span class="font-extrabold text-base ${p.jumlah_poin >= 0 ? 'text-emerald-600' : 'text-rose-600'}">${p.jumlah_poin >= 0 ? `+${p.jumlah_poin}` : p.jumlah_poin}</span>
                        </div>
                    `).join("")}
                </div>`;
            }

            if (appState.activeMenu === "nilai_bulanan") {
                return `
                <div class="bg-white rounded-3xl p-5 sm:p-6 border border-brand-100 shadow-sm space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                        <div>
                            <h2 class="font-extrabold text-brand-900 text-base sm:text-lg">Rincian Nilai Bulanan (${getMonthName(bulan)} ${tahun})</h2>
                            <p class="text-xs text-slate-500">Perhitungan nilai otomatis berdasarkan bobot komponen Rumah Qur'an Kitabunaa.</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-bold text-slate-400 block">Nilai Akhir</span>
                            <span class="text-xl sm:text-2xl font-extrabold text-brand-800">${evalData.nilaiAkhir ?? 'Proses'}</span>
                        </div>
                    </div>
                    <div class="space-y-2.5">
                        ${evalData.rincian.map(r => `
                            <div class="p-3.5 rounded-2xl bg-brand-50/50 border border-brand-100 flex items-center justify-between">
                                <div>
                                    <p class="font-extrabold text-xs sm:text-sm text-brand-950">${r.no}. ${r.nama_komponen}</p>
                                    <p class="text-[11px] text-slate-500">Bobot: ${r.bobot}% ${r.catatan ? `• Catatan: ${r.catatan}` : ''}</p>
                                </div>
                                <div class="text-right">
                                    <span class="font-extrabold text-sm text-brand-900">${r.nilai !== null ? r.nilai : 'Belum dinilai'}</span>
                                    <span class="block text-[11px] text-brand-600 font-bold">Berbobot: ${r.nilai_berbobot !== null ? r.nilai_berbobot.toFixed(2) : '-'}</span>
                                </div>
                            </div>
                        `).join("")}
                    </div>
                </div>`;
            }

            if (appState.activeMenu === "erapor_saya" || appState.activeMenu === "riwayat_rapor") {
                const periods = [
                    { b: "09", t: "2026" },
                    { b: "10", t: "2026" },
                    { b: "11", t: "2026" }
                ];
                return `
                <div class="space-y-4">
                    <div class="bg-white rounded-3xl p-5 border border-brand-100 shadow-sm">
                        <h2 class="font-extrabold text-brand-900 text-base sm:text-lg">Daftar Dokumen E-Rapor Saya</h2>
                        <p class="text-xs text-slate-500">Anda dapat membuka pratinjau resmi dan mengunduh file PDF E-Rapor milik Anda yang telah diterbitkan.</p>
                    </div>
                    ${periods.map(p => {
                        const rp = myRapors.find(r => r.periode_bulan === p.b && r.periode_tahun === p.t && r.status_penerbitan === "Diterbitkan");
                        return `
                        <div class="bg-white rounded-3xl p-5 border border-brand-100 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div class="space-y-1">
                                <div class="flex items-center gap-2">
                                    <h3 class="font-extrabold text-brand-950 text-base">E-Rapor ${getMonthName(p.b)} ${p.t}</h3>
                                    <span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold ${rp ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-500'}">
                                        ${rp ? 'Tersedia (Resmi Diterbitkan)' : 'Belum diterbitkan'}
                                    </span>
                                </div>
                                ${rp ? `
                                    <p class="text-xs text-slate-600">Nilai Akhir: <b class="text-brand-900">${rp.nilai_akhir}</b> (${rp.predikat}) • Terbit: ${rp.tanggal_diterbitkan}</p>
                                    <p class="text-xs text-slate-500 italic">"${rp.catatan_perkembangan?.catatan_pembimbing || ''}"</p>
                                ` : `<p class="text-xs text-slate-400">Menunggu proses penerbitan otomatis tanggal 01 atau kelengkapan evaluasi.</p>`}
                            </div>
                            ${rp ? `
                                <div class="flex items-center gap-2 shrink-0">
                                    <button type="button" onclick="window.openRaporPreviewModal('${student.id}', '${p.b}', '${p.t}')" class="px-4 py-2.5 rounded-full bg-brand-50 hover:bg-brand-100 text-brand-900 border border-brand-200 text-xs font-extrabold flex items-center gap-1.5">
                                        <i data-lucide="eye" class="w-4 h-4"></i> Pratinjau
                                    </button>
                                    <button type="button" onclick="window.downloadRaporPDF('${rp.id}')" class="px-4 py-2.5 rounded-full bg-brand-800 hover:bg-brand-950 text-white text-xs font-extrabold flex items-center gap-1.5 shadow">
                                        <i data-lucide="download" class="w-4 h-4 text-accent-400"></i> Unduh PDF
                                    </button>
                                </div>
                            ` : ''}
                        </div>`;
                    }).join("")}
                </div>`;
            }

            // Default: BERANDA SANTRI
            return `
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5 mb-6">
                <div class="bg-white rounded-3xl p-4 border border-brand-100 shadow-sm text-center">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Target Hafalan</p>
                    <p class="text-xl font-extrabold text-brand-800 mt-1">${metrics.persentaseTarget}%</p>
                    <p class="text-[11px] text-slate-500">${metrics.jumlahAyatUnikBaru}/${metrics.targetAyat} Ayat Baru</p>
                </div>
                <div class="bg-white rounded-3xl p-4 border border-brand-100 shadow-sm text-center">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Poin Aktivitas</p>
                    <p class="text-xl font-extrabold text-amber-500 mt-1">+${totalPoin}</p>
                    <p class="text-[11px] text-slate-500">Periode ${getMonthName(bulan)}</p>
                </div>
                <div class="bg-white rounded-3xl p-4 border border-brand-100 shadow-sm text-center">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">Nilai Akhir</p>
                    <p class="text-xl font-extrabold text-emerald-600 mt-1">${currentRapor?.nilai_akhir ?? (evalData.nilaiAkhir ?? '-')}</p>
                    <p class="text-[11px] text-slate-500">${currentRapor?.predikat || evalData.predikat}</p>
                </div>
                <div class="bg-white rounded-3xl p-4 border border-brand-100 shadow-sm text-center">
                    <p class="text-[10px] font-bold text-slate-400 uppercase">E-Rapor ${getMonthName(bulan)}</p>
                    <p class="text-sm font-extrabold ${currentRapor?.status_penerbitan === 'Diterbitkan' ? 'text-emerald-700' : 'text-amber-600'} mt-2">
                        ${currentRapor?.status_penerbitan === 'Diterbitkan' ? 'Tersedia' : 'Menunggu'}
                    </p>
                </div>
            </div>

            <!-- Podium & Peringkat Santri Terbaik Bulanan di Beranda Santri -->
            ${renderBestStudentsSection(bulan, tahun, true, student.id)}

            <!-- Grafik Perkembangan Individual Santri -->
            <div class="bg-white rounded-3xl p-5 sm:p-6 border border-brand-100 shadow-sm mb-6">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3 pb-3 border-b border-slate-100">
                    <div>
                        <h3 class="font-extrabold text-brand-900 text-base flex items-center gap-2">
                            <i data-lucide="trending-up" class="w-5 h-5 text-brand-600"></i> Grafik Perkembangan Hafalan & Nilai Saya
                        </h3>
                        <p class="text-xs text-slate-500">Pantau peningkatan nilai bulanan dan jumlah ayat unik baru yang berhasil disetorkan.</p>
                    </div>
                    <button type="button" onclick="window.navigateMenu('grafik_saya')" class="self-start sm:self-center px-3.5 py-1.5 rounded-full bg-brand-50 hover:bg-brand-100 text-brand-800 border border-brand-200 text-xs font-extrabold flex items-center gap-1">
                        <i data-lucide="bar-chart-2" class="w-3.5 h-3.5"></i> Buka Detail Analitik
                    </button>
                </div>
                ${renderProfessionalDevelopmentChart(student.id, tahun)}
            </div>

            ${currentRapor && currentRapor.status_penerbitan === "Diterbitkan" ? `
                <div class="bg-gradient-to-r from-brand-800 to-brand-600 rounded-3xl p-5 sm:p-6 text-white shadow-lg mb-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                    <div>
                        <span class="bg-accent-400 text-brand-950 text-[10px] font-extrabold px-3 py-1 rounded-full uppercase">E-Rapor Resmi Tersedia</span>
                        <h3 class="text-lg font-extrabold mt-2">E-Rapor Periode ${getMonthName(bulan)} ${tahun} Telah Terbit!</h3>
                        <p class="text-xs text-brand-100 mt-1">${currentRapor.deskripsi_pencapaian}</p>
                    </div>
                    <div class="flex gap-2 shrink-0">
                        <button type="button" onclick="window.openRaporPreviewModal('${student.id}', '${bulan}', '${tahun}')" class="px-4 py-2.5 rounded-full bg-white text-brand-900 font-extrabold text-xs">Lihat Rapor</button>
                        <button type="button" onclick="window.downloadRaporPDF('${currentRapor.id}')" class="px-4 py-2.5 rounded-full bg-accent-400 text-brand-950 font-extrabold text-xs flex items-center gap-1.5">
                            <i data-lucide="download" class="w-4 h-4"></i> Unduh PDF
                        </button>
                    </div>
                </div>
            ` : ''}`;
        }

        // Jalankan Aplikasi saat DOM siap
        async function bootApp() {
            if (!IS_PREVIEW && fbDb) {
                // Hapus sesi Firebase yang tersisa dari kunjungan sebelumnya (aplikasi selalu mulai dari layar masuk)
                try { if (fbAuth) await signOut(fbAuth); } catch {}
                await Promise.race([loadPublicBootData(), new Promise(r => setTimeout(r, 6000))]);
            }
            renderApp();
        }
        bootApp();
    </script>
</body>
</html>
